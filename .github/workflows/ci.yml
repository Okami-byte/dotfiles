# Which checks block a merge (see the "Protect main" ruleset):
#   REQUIRED  "Secret scan" (this file) and "Hardcoded secret env vars" (envcheck.yml).
#             A secret pushed to a public repo lives in git history forever, so this
#             is the one mistake worth blocking on.
#   ADVISORY  "Lint": shows red/green on the PR but never blocks. Read it, fix what is real.
#   MANUAL    "Brewfile and stow check": weekly + on demand only (slow macOS runner).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 14 * * 1" # weekly: catch Brewfile rot even when nothing changed
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans history, not just the latest commit

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          severity: warning
          # Vendored third-party plugin code, local build/cache dirs, and the archived
          # Bash sketchybar snapshot (another author's config, frozen after the Lua migration)
          # — not ours to fix.
          ignore_paths: >-
            herdr/plugins
            .venv
            mpv/cache
            sketchybar.sh
          # Also catch extensionless scripts that only carry a shebang.
          additional_files: >-
            scripts/herdr_start
            scripts/sesh_start
            yabai/yabairc
            borders/bordersrc

      # `if: !cancelled()` on every step below: one failing check must not hide the others.
      - name: Stylua (nvim)
        if: ${{ !cancelled() }}
        uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: latest
          args: --check nvim

      - name: Fish syntax
        if: ${{ !cancelled() }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fish
          find fish -name '*.fish' -print0 | xargs -0 -n1 fish --no-execute

      - name: JSON / TOML parse
        if: ${{ !cancelled() }}
        run: |
          find . -name '*.json' -not -path './.git/*' -not -path './.venv/*' \
            -not -path './karabiner/automatic_backups/*' -print0 \
            | xargs -0 -n1 python3 -m json.tool >/dev/null
          find . -name '*.toml' -not -path './.git/*' -not -path './.venv/*' -print0 \
            | xargs -0 -n1 python3 -c 'import sys,tomllib; tomllib.load(open(sys.argv[1],"rb"))'

  bootstrap:
    name: Brewfile and stow check
    # Slow macOS runner and not worth gating PRs on: weekly schedule or manual run only.
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Brewfile still resolves
        run: |
          # Tap exactly as the Brewfile declares: honor custom clone URLs, and trust only
          # taps the Brewfile marks `trusted:` (Homebrew refuses to load formulae from
          # untrusted taps, so a dropped flag shows up here as a failure).
          while IFS= read -r line; do
            name=$(sed -E 's/^tap "([^"]+)".*/\1/' <<<"$line")
            url=$(sed -nE 's/^tap "[^"]+", "([^"]+)".*/\1/p' <<<"$line")
            if brew tap "$name" ${url:+"$url"}; then
              if grep -q 'trusted:' <<<"$line"; then brew trust "$name"; fi
            else
              echo "::warning::dead tap $name"
            fi
          done < <(grep -E '^tap ' Brewfile)

          # Per-package trust, e.g. `brew "tap/user/name", trusted: true`.
          while read -r kind pkg; do
            flag=--formula; [ "$kind" = cask ] && flag=--cask
            brew trust "$flag" "$pkg" || echo "::warning::could not trust $pkg"
          done < <(grep -E '^(brew|cask) ".*trusted:' Brewfile | sed -E 's/^(brew|cask) "([^"]+)".*/\1 \2/')

          # Every formula and cask must still resolve; report all of them, not just the first.
          fail=0
          for f in $(brew bundle list --formula); do
            brew info --formula "$f" >/dev/null 2>&1 || { echo "::error::formula missing or untrusted: $f"; fail=1; }
          done
          for c in $(brew bundle list --cask); do
            brew info --cask "$c" >/dev/null 2>&1 || { echo "::error::cask missing or untrusted: $c"; fail=1; }
          done
          exit $fail

      - name: Stow dry run
        if: ${{ !cancelled() }}
        run: |
          brew install stow
          mkdir -p "$HOME/.config"
          stow -nv --dir="$PWD/.." --target="$HOME/.config" "$(basename "$PWD")"
