git:
  overrideGpg: true
  diffRenderers:
    - colorArg: always
      command: delta --dark --paging=never
      useConfig: false
gui:
  showNumstatInFilesView: true
  skipRewordInEditorWarning: true
  tabWidth: 2
  theme:
    activeBorderColor:
      - yellow
      - bold
    searchingActiveBorderColor:
      - yellow
      - bold
    inactiveBorderColor:
      - "#6e6a86"
    selectedLineBgColor:
      - black
    authorColors:
      "*": magenta
  border: single
  nerdFontsVersion: "3"
  spinner:
    frames:
      - "⠋"
      - "⠙"
      - "⠹"
      - "⠸"
      - "⠼"
      - "⠴"
      - "⠦"
      - "⠧"
      - "⠇"
      - "⠏"
    rate: 80
keybinding:
  files:
    viewResetOptions: <disabled>
