# ── Reset ──────────────────────────────────────────────────────────────

unbind-key -a

# ── Session & Client ──────────────────────────────────────────────────

bind d detach
bind ^X lock-server
bind Q kill-session

# ── Windows ───────────────────────────────────────────────────────────

bind ^C new-window -c "$HOME"
bind ^A last-window
bind p previous-window
bind n next-window
bind "," command-prompt "rename-window %%"
bind x kill-pane

# ── Panes ─────────────────────────────────────────────────────────────

bind - split-window -v -c "#{pane_current_path}"
bind \\ split-window -h -c "#{pane_current_path}"
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r '[' rotate-window -U
bind -r ']' rotate-window -D
bind z resize-pane -Z

bind -r -T prefix , resize-pane -L 20
bind -r -T prefix . resize-pane -R 20
bind -r -T prefix _ resize-pane -D 7
bind -r -T prefix = resize-pane -U 7

bind P set pane-border-status

# ── Copy Mode ─────────────────────────────────────────────────────────

bind Escape copy-mode
bind-key -T copy-mode-vi v send-keys -X begin-selection

# ── Misc ──────────────────────────────────────────────────────────────

bind : command-prompt
bind r source-file ~/.config/tmux/tmux.conf

# ── Sesh ──────────────────────────────────────────────────────────────

bind-key ";" new-pane -O -C -B none -x 100% -y 100% -X 0 -Y 0 "sesh picker -idHs"
bind-key "!" new-pane -O -C -B none -x 100% -y 100% -X 0 -Y 0 "sesh picker -idHs --query '#'"
bind-key "w" new-pane -O -C -B none -x 100% -y 100% -X 0 -Y 0 "sesh worktree picker || tmux display-message -d 1000 'No worktrees detected'"

# ── Tmux-Fzf ──────────────────────────────────────────────────────────────

TMUX_FZF_LAUNCH_KEY=","
