#
#  Smart session manager for the terminal
#  https://github.com/joshmedeski/sesh

# import = ["~/.config/sesh/configs/nu-sesh.toml"]
#:schema https://github.com/joshmedeski/sesh/raw/main/sesh.schema.json

blacklist = ["^scratch$", "^_", '^~/\.config(?:/.*)?$']
cache = true
separator_aware = true
dir_length = 2


# Tui
[tui]
prompt = "󰑃 "
placeholder = "Choose a session "
show_icons = true
show_windows = true
preview = true
preview_border = "thick"   # "thick" | "double" | "none"

[[worktree]]
repo = "dotfiles"
path = "~/.dotfiles"
worktree_dir = ".wk-tree"
branch_template = "{number}"
base_branch = "origin/main"
startup_command = "nvim"

# Sessions

[default_session]
startup_command = "nvim && exit"
startup_command_ignore_dirs = ["~/repos", "~/.config", "/Users/fox"]
preview_command = "eza --all --icons --color=always {} && echo '---' && git -C {} status --short"

# common

[[session]]
name = "notes"
path = "~/Notes"

[[session]]
name = "python projects"
path = "~/Developer/Projects/Python"

[[session]]
name = "developer"
path = "~/Developer/Projects"

[[session]]
name = "claude"
icon = "󱙺 "
path = "~/.claude"
startup_command = "claude"

[[session]]
name = "work"
path = "~/Developer/WorkTools/"
startup_command = "la"
preview_command = "bat --style=snip --color=always"
windows = ["qc","pxe"]

[[window]]
name = "qc"
path = "~/Developer/WorkTools/lifecycle-lemur/"
startup_script = "la"

[[window]]
name = "pxe"
path = "~/Developer/WorkTools/tools-master/pxe/"
startup_script = "la"

# configs

[[session]]
name = "dotfiles"
path = "~/.dotfiles"

[[session]]
name = "wezterm config"
path = "~/.dotfiles/wezterm"
startup_command = "nvim wezterm.lua"

[[session]]
name = "fish config"
path = "~/.dotfiles/fish"
preview_command = "bat --language=fish --style=snip --color=always ~/.dotfiles/fish/config.fish"

[[session]]
name = "kitty config"
path = "~/.dotfiles/kitty"
startup_command = "nvim kitty.conf"

[[session]]
name = "neovim config"
path = "~/.dotfiles/nvim"

[[session]]
name = "sketchybar config"
path = "~/.dotfiles/sketchybar"

[[session]]
name = "sesh config"
icon = "⚡"
path = "~/.config/sesh"
startup_command = "nvim sesh.toml"
preview_command = "bat --language=toml --style=snip --color=always ~/.config/sesh/sesh.toml"

[[session]]
name = "tmux config"
path = "~/.dotfiles/tmux"
startup_command = "nvim tmux.conf"
preview_command = "bat --language=bash --style=snip --color=always ~/.dotfiles/tmux/tmux.conf"

[[session]]
name = "yazi config"
path = "~/.dotfiles/yazi"
startup_command = "nvim yazi.toml"

[[session]]
name = "ghostty config"
path = "~/.dotfiles/ghostty"
startup_command = "nvim config"

[[session]]
name = "karabiner elements config"
icon = "󰌓 "
path = "~/.dotfiles/karabiner"

[[session]]
name = "yabai config"
path = "~/.dotfiles/yabai"
startup_command = "nvim yabairc"
preview_command = "bat --style=snip --color=always ~/.dotfiles/yabai/yabairc"

[[session]]
name = "skhd config"
path = "~/.dotfiles/skhd"
startup_command = "nvim skhdrc"
preview_command = "bat --style=snip --color=always ~/.dotfiles/skhd/skhdrc"

